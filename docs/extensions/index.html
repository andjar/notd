Turning extensions on Extensions listed in ACTIVE_EXTENSIONS get an icon in the left sidebar. Set the list in config.local.php using the folder names:
define('ACTIVE_EXTENSIONS', ['kanban_board', 'pomodoro_timer', 'attachment_dashboard']); Zen, Excalidraw and the math notepad work on a single note and are opened from the note menu (right-click a bullet), whether or not they are in the list.

baseURL = "/notd/"
languageCode = "en-us"
title = "notd"
theme = "kube"

canonifyURLs = true
relativeURLs = false

# Menu configuration
[[menu.main]]
    name = "Overview"
    url = "/docs/overview/"
    weight = 10

[[menu.main]]
    name = "Using notd"
    url = "/docs/guide/"
    weight = 15

[[menu.main]]
    name = "Protocol"
    url = "/docs/protocol/"
    weight = 20

[[menu.main]]
    name = "Plugins"
    url = "/docs/plugins/"
    weight = 25

[[menu.main]]
    name = "Development"
    url = "/docs/development/"
    weight = 30

# Parameters
[params]
    author = "Anders Hagen Jarmund"
    description = "notd: a personal outliner built to last"
    
    # Control what gets indexed
    noindex_kinds = [
        "taxonomy",
        "taxonomyTerm"
    ]

# Markup settings for better documentation
[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.highlight]
        style = "github"
        lineNos = false
        codeFences = true
        tabWidth = 4
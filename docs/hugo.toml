baseURL = "/notd/"
languageCode = "en-us"
title = "notd"
theme = "kube"

canonifyURLs = true
relativeURLs = false

# Menu configuration
[[menu.main]]
    name = "Overview"
    url = "/docs/overview/"
    weight = 10

[[menu.main]]
    name = "User Guide"
    url = "/docs/frontend-guide/"
    weight = 15

[[menu.main]]
    name = "API Reference"
    url = "/docs/api-reference/"
    weight = 20

[[menu.main]]
    name = "Extensions"
    url = "/docs/extensions/"
    weight = 25

[[menu.main]]
    name = "Development"
    url = "/docs/development/"
    weight = 30

[[menu.main]]
    name = "OpenAPI"
    url = "/docs/openapi/"
    weight = 35

[[menu.main]]
    name = "FAQ"
    url = "/faq/"
    weight = 40

# Parameters
[params]
    author = "Anders Hagen Jarmund"
    description = "notd: a simple outliner built to last"
    
    # Control what gets indexed
    noindex_kinds = [
        "taxonomy",
        "taxonomyTerm"
    ]

# Markup settings for better documentation
[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.highlight]
        style = "github"
        lineNos = false
        codeFences = true
        tabWidth = 4
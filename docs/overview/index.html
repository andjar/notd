<!doctype html><html lang=en-us><head><meta name=generator content="Hugo 0.169.0"><meta charset=utf-8><meta http-equiv=X-UA-Compatible content="IE=edge"><meta name=viewport content="width=device-width,initial-scale=1"><title>Overview</title><meta name=author content="Anders Hagen Jarmund"><meta property="og:url" content="/notd/docs/overview/"><meta property="og:site_name" content="notd"><meta property="og:title" content="Overview"><meta property="og:description" content="notd is a small outliner for notes, journals and tasks, inspired by Logseq. It runs on anything that runs PHP and keeps everything in one SQLite file that you own.
What it does Outline editing. Every note is a bullet that can be nested, collapsed, dragged, reordered and zoomed into. Enter splits a note, Backspace joins it to the one above, and Ctrl + Z undoes. Notes are written in Markdown. Journal. Each day has its own page; notd opens today’s page by default. Links and backlinks. [[Page Name]] links pages; every page shows what links to it. Tasks. Start a note with TODO, DOING, DONE, … and it becomes a task with a checkbox. Properties. {key::value} anywhere in a note or page becomes searchable metadata. Queries and transclusion. List notes with SQL{...}; embed a note elsewhere with !{{note-id}}. Attachments, templates, namespaces, favorites, password-locked pages. Print and export. Print a page or save it as PDF; export a page or the whole notebook as Markdown files, and import Markdown, including folders written by Logseq. Extensions. Kanban board, pomodoro timer, attachment dashboard, distraction-free editor and more. An HTTP API that can do everything the interface can. Built to last notd is deliberately made of few, well-understood parts:"><meta property="og:locale" content="en_us"><meta property="og:type" content="website"><link href=/notd/docs/overview/index.xml rel=alternate type=application/rss+xml title=notd><link rel=canonical href=/notd/docs/overview/><link rel=icon type=image/svg+xml href=/notd/images/notd.svg><link rel="alternate icon" type=image/png href=/notd/images/notd.svg><link href=/notd/css/font.css rel=stylesheet type=text/css><link href=/notd/css/kube.min.css rel=stylesheet type=text/css><link href=/notd/css/kube.legenda.css rel=stylesheet type=text/css><link href=/notd/css/highlight.css rel=stylesheet type=text/css><link href=/notd/css/main.css rel=stylesheet type=text/css><link href=/notd/css/custom.css rel=stylesheet type=text/css><script src=/notd/js/jquery-2.1.4.min.js type=text/javascript></script><script type=text/javascript src=/notd/js/tocbot.min.js></script></head><body class=page-kube><header

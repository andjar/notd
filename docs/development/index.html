<!doctype html><html lang=en-us><head><meta name=generator content="Hugo 0.169.0"><meta charset=utf-8><meta http-equiv=X-UA-Compatible content="IE=edge"><meta name=viewport content="width=device-width,initial-scale=1"><title>Development</title><meta name=author content="Anders Hagen Jarmund"><meta property="og:url" content="/notd/docs/development/"><meta property="og:site_name" content="notd"><meta property="og:title" content="Development"><meta property="og:description" content="How notd is put together, and the rules that keep it small and long-lived.
Principles No build step. The repository is the application. PHP files are served as they are; the browser loads plain ES modules. Nothing is compiled, bundled or installed. No runtime dependencies to fetch. The handful of libraries (Alpine.js, marked, DOMPurify, Sortable, SJCL, Feather) are stored in assets/libs/. Nothing is loaded from the internet. Boring technology. PHP, SQLite, HTML, CSS and JavaScript as browsers and PHP ship them. Content is the source of truth. Properties, links and task states are parsed from note text. Derived tables can always be rebuilt from it. GET and POST only, so the app runs under minimal web servers such as phpdesktop. One write path per kind of record, shared by the interface, the extensions and scripts. Your data stays yours. SQLite plus plain Markdown export and import in the Logseq layout. Layout index.php, page.php entry point and the single application page router.php request filter for PHP's built-in server config.php default settings (overrides: config.local.php) api/ bootstrap.php loaded by every endpoint: config, autoloader, request helpers, cross-site check v1/*.php HTTP endpoints, one file each NoteOps.php the note write path: applies operations in a transaction PageStore.php the page write path: create, rename (rewrites links), delete Attachments.php the attachment write path: type whitelist, storage, URLs PropertyIndex.php parses properties, links and tasks from content into the index Ordering.php fractional sort keys and id generation DataManager.php read queries Markdown.php Markdown export and import (Logseq layout) Templates.php template files and placeholders PropertyTriggerService.php, WebhooksManager.php reactions to property changes db_connect.php connection, first-run setup, migrations, notd_write() transactions db/ schema.sql the whole schema migrations.php automatic upgrades (v3 to v4, ...) migrate_v3.php manual migration from schema v2 tools/ command-line export and import assets/ js/api_client.js the HTTP API, for the app and for extensions js/app/ state and actions: outline, outbox, page, search, keys js/ui/ the screen: note rendering, events, menus, dialogs, embeds css/ one file per component, themes as custom properties libs/ bundled third-party libraries template/ note and page templates extensions/ optional apps built on the API tests/ model, API and browser tests docs/ this site (Hugo) How saving works The outline is the part of notd where the browser and the server must never disagree, so it has one model and one write path."><meta property="og:locale" content="en_us"><meta property="og:type" content="website"><link href=/notd/docs/development/index.xml rel=alternate type=application/rss+xml title=notd><link rel=canonical href=/notd/docs/development/><link rel=icon type=image/svg+xml href=/notd/images/notd.svg><link rel="alternate icon" type=image/png href=/notd/images/notd.svg><link href=/notd/css/font.css rel=stylesheet type=text/css><link href=/notd/css/kube.min.css rel=stylesheet type=text/css><link href=/notd/css/kube.legenda.css rel=stylesheet type=text/css><link href=/notd/css/highlight.css rel=stylesheet type=text/css><link href=/notd/css/main.css rel=stylesheet type=text/css><link href=/notd/css/custom.css rel=stylesheet type=text/css><script src=/notd/js/jquery-2.1.4.min.js type=text/javascript></script><script type=text/javascript src=/notd/js/tocbot.min.js></script></head><body class=page-kube><header><div class=show-sm><div id=nav-toggle-box><div id=nav-toggle-brand><a href=/notd/>notd</a></div><a data-component=toggleme data-target=#top href=# id=nav-toggle><i class=kube-menu></i></a></div></div><div class=hide-sm id=top><div id=top-brand><a href=/notd/ title=home>notd</a></div><nav id=top-nav-main><ul><li><a href=/notd/docs/overview/>Overview</a></li><li><a href=/notd/docs/frontend-guide/>User Guide</a></li><li><a href=/notd/docs/api-reference/>API Reference</a></li><li><a href=/notd/docs/extensions/>Extensions</a></li><li><a href=/notd/docs/de

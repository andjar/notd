<!doctype html><html lang=en-us><head><meta name=generator content="Hugo 0.169.0"><meta charset=utf-8><meta http-equiv=X-UA-Compatible content="IE=edge"><meta name=viewport content="width=device-width,initial-scale=1"><title>Development</title><meta name=author content="Anders Hagen Jarmund"><meta property="og:url" content="/notd/docs/development/"><meta property="og:site_name" content="notd"><meta property="og:title" content="Development"><meta property="og:description" content="How notd is put together, and the rules that keep it small and long-lived.
Principles No build step. The repository is the application. PHP files are served as they are; the browser loads plain ES modules. Nothing is compiled, bundled or installed. No runtime dependencies to fetch. The handful of libraries (Alpine.js, marked, DOMPurify, Sortable, SJCL, Feather) are stored in assets/libs/. Nothing is loaded from the internet. Boring technology. PHP, SQLite, HTML, CSS and JavaScript as browsers and PHP ship them. Content is the source of truth. Properties, links and task states are parsed from note text. Derived tables can always be rebuilt from it. GET and POST only, so the app runs under minimal web servers such as phpdesktop. One write path for notes, shared by the interface, the extensions and scripts. Layout index.php, page.php entry point and the single application page config.php default settings (overrides: config.local.php) api/ v1/*.php HTTP endpoints, one file each NoteOps.php the note write path: applies operations in a transaction Ordering.php fractional sort keys and id generation DataManager.php read queries PatternProcessor.php parses properties, links, tasks from content PropertyTriggerService.php, WebhooksManager.php reactions to property changes db_connect.php connection, first-run setup, schema version check db/ schema.sql the whole schema migrate_v3.php migration from schema v2 assets/ js/app/ application logic (see below) js/ui/ rendering and DOM handling css/ one file per component, themes as custom properties libs/ bundled third-party libraries template/ note and page templates extensions/ optional apps built on the API tests/ model, API and browser tests docs/ this site (Hugo) How saving works The outline is the part of notd where the browser and the server must never disagree, so it has one model and one write path."><meta property="og:locale" content="en_us"><meta property="og:type" content="website"><link href=/notd/docs/development/index.xml rel=alternate type=application/rss+xml title=notd><link rel=canonical hr

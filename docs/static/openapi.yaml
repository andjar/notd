openapi: 3.0.3
info:
  title: Notd Outliner API
  description: "A RESTful API for a PHP-based outliner application that runs offline using phpdesktop.\n\n## Overview\n\
    This API provides endpoints for managing pages, notes, properties, attachments, and more in a hierarchical outliner\
    \ structure.\n\n## Key Features\n- **Content-first Property Model**: Properties are parsed from content using\
    \ pattern matching\n- **Hierarchical Structure**: Notes can be nested under pages and other notes\n- **Property\
    \ System**: Supports different property weights (public, internal, system)\n- **Full-text Search**: Powered\
    \ by SQLite FTS4\n- **File Attachments**: Support for various file types\n- **Templates**: Reusable content\
    \ templates for notes and pages\n- **Webhooks**: Real-time event notifications\n- **Atomic operations**: all\
    \ note writes go through one idempotent endpoint, `/ops.php`\n\n## Authentication\nThis API does not require\
    \ authentication as it's designed for offline use.\n\n## Base URL\nThe API is served from the `/api/v1/` path\
    \ relative to your application root.\n\n## Response Format\nAll responses follow a consistent JSON format:\n\
    ```json\n{\n  \"status\": \"success|error\",\n  \"data\": {...},\n  \"message\": \"Error message (if applicable)\"\
    \n}\n```\n\n## Property System\nProperties are extracted from content using patterns like `{key::value}`:\n\
    - `{key::value}` - Public property (weight 2)\n- `{key:::value}` - Internal property (weight 3)\n- `{key::::value}`\
    \ - System log property (weight 4)\n\n## Task States\nSupported task statuses: TODO, DOING, DONE, SOMEDAY, WAITING,\
    \ CANCELLED, NLR\n"
  version: 3.0.0
  contact:
    name: API Support
    url: https://github.com/your-repo/notd
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: /api/v1
  description: API v1 base URL
paths:
  /ping.php:
    get:
      summary: Health check endpoint
      description: Simple endpoint to verify the API is running
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pong
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00Z'
  /pages.php:
    get:
      summary: List or retrieve pages
      description: 'Retrieve pages with various filtering options. If a specific page name is provided,

        it will be created if it doesn''t exist.

        '
      parameters:
      - name: name
        in: query
        description: Specific page name to retrieve/create
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Page ID to retrieve
        required: false
        schema:
          type: integer
      - name: date
        in: query
        description: Get pages with a specific date property (YYYY-MM-DD format)
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: names
        in: query
        description: With any value, return only the names of all pages (an array of strings)
        required: false
        schema:
          type: string
      - name: month
        in: query
        description: Return the days of this month (YYYY-MM) that have a journal page, as [{date, page_name}]
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: exclude_journal
        in: query
        description: Exclude journal pages (those with {type::journal} property)
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Pages retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Page'
                - $ref: '#/components/schemas/PageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create a new page
      description: Create a new page with the specified name and content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Page name (must be unique)
                content:
                  type: string
                  description: Page content (can include properties)
      responses:
        '201':
          description: Page created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Page with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Update an existing page
      description: Update a page's name and/or content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  description: Page ID to update
                name:
                  type: string
                  description: New page name
                content:
                  type: string
                  description: New page content
      responses:
        '200':
          description: Page updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete a page
      description: Delete a page and all its associated notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  description: Page ID to delete
      responses:
        '200':
          description: Page deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_page_id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /export.php:
    get:
      summary: Export a page as Markdown
      description: The page's outline in Logseq's Markdown layout (one "- " bullet per note, nested with tabs).
      parameters:
      - name: page
        in: query
        description: Page name (or use page_id)
        required: false
        schema:
          type: string
      - name: page_id
        in: query
        required: false
        schema:
          type: integer
      - name: download
        in: query
        description: With any value, send the file as an attachment
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The page as Markdown
          content:
            text/markdown:
              schema:
                type: string
        '404':
          description: No such page
  /child_pages.php:
    get:
      summary: Get child pages
      description: Retrieve direct child pages of a namespace
      parameters:
      - name: namespace
        in: query
        description: Parent namespace/page name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Child pages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    updated_at:
                      type: string
                      format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /notes.php:
    get:
      summary: Read notes
      description: Get one note by id, or all notes of a page (flat, ordered by sort_key then id). Notes are read-only
        here; writes go to /ops.php.
      parameters:
      - name: id
        in: query
        description: Specific note ID to retrieve
        required: false
        schema:
          type: string
      - name: page_id
        in: query
        description: Get all notes for a specific page
        required: false
        schema:
          type: integer
      - name: include_internal
        in: query
        description: Include internal properties in the response
        required: false
        schema:
          type: boolean
          default: false
      - name: include_parent_properties
        in: query
        description: Include properties from parent notes
        required: false
        schema:
          type: boolean
          default: false
      - name: include_children
        in: query
        description: 'With id: include the nested subtree as `children`'
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Notes retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Note'
                - type: array
                  items:
                    $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /ops.php:
    post:
      tags:
      - Notes
      summary: Apply note operations
      description: 'The only write endpoint for notes. Operations are applied in order inside one transaction: either
        all of them are applied or none. At most 500 operations per request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ops
              properties:
                ops:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/Operation'
            example:
              ops:
              - op_id: demo-1
                type: create
                id: 0192f6a0-7c3e-7b1a-9f3e-2b1c4d5e6f70
                page_id: 87
                parent_id: null
                after: null
                content: Hello
      responses:
        '200':
          description: Operations applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/OperationsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          description: Not a POST request
        '413':
          description: More than 500 operations
        '503':
          description: Database busy; retry with the same op_ids
        '500':
          $ref: '#/components/responses/ServerError'
  /append_to_page.php:
    post:
      summary: Append notes to a page
      description: 'Create a page if it doesn''t exist and append one or more notes to it.

        This is a convenience endpoint that combines page creation and note creation.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - page_name
              - notes
              properties:
                page_name:
                  type: string
                  description: Name of the page to append to (will be created if it doesn't exist)
                notes:
                  oneOf:
                  - type: string
                    description: Single note content
                  - type: array
                    items:
                      $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: Notes appended successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  page:
                    $ref: '#/components/schemas/Page'
                  appended_notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                    description: Every note that was created, as a flat list
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /properties.php:
    get:
      summary: Get properties for an entity
      description: Retrieve properties for a note or page
      parameters:
      - name: entity_type
        in: query
        description: Type of entity (note or page)
        required: true
        schema:
          type: string
          enum:
          - note
          - page
      - name: entity_id
        in: query
        description: ID of the entity
        required: true
        schema:
          type: integer
      - name: include_hidden
        in: query
        description: Include hidden/internal properties
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Properties retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Method not allowed (read-only endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search.php:
    get:
      summary: Search notes and pages
      description: 'Perform various types of searches including full-text search, backlinks, tasks, and favorites.

        '
      parameters:
      - name: q
        in: query
        description: Full-text search query
        required: false
        schema:
          type: string
      - name: backlinks_for_page_name
        in: query
        description: Find notes that link to a specific page
        required: false
        schema:
          type: string
      - name: tasks
        in: query
        description: Find notes with specific task status (or 'all' for all tasks)
        required: false
        schema:
          type: string
          enum:
          - TODO
          - DOING
          - DONE
          - SOMEDAY
          - WAITING
          - CANCELLED
          - ALL
      - name: favorites
        in: query
        description: Find pages marked as favorites
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: include_parent_properties
        in: query
        description: Include properties from parent notes
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /query_notes.php:
    post:
      summary: Execute custom SQL queries
      description: 'Execute safe, predefined SQL queries to find notes. Only SELECT queries are allowed

        with specific patterns to prevent SQL injection.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sql_query
              properties:
                sql_query:
                  type: string
                  description: 'SQL query to execute. Must follow allowed patterns:

                    - SELECT id FROM Notes WHERE ...

                    - SELECT (DISTINCT)? N.id FROM Notes N JOIN Properties P ON N.id = P.note_id WHERE ...

                    - SELECT id FROM Notes WHERE id IN (SELECT note_id FROM Properties WHERE ...)

                    '
                page:
                  type: integer
                  description: Page number for pagination
                  default: 1
                  minimum: 1
                per_page:
                  type: integer
                  description: Number of items per page
                  default: 20
                  minimum: 1
                  maximum: 100
                include_properties:
                  type: boolean
                  description: Include properties in the response
                  default: true
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /attachments.php:
    get:
      summary: List attachments
      description: Retrieve attachments with optional filtering and pagination
      parameters:
      - name: note_id
        in: query
        description: Get attachments for a specific note
        required: false
        schema:
          type: string
      - name: sort_by
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          enum:
          - id
          - name
          - path
          - type
          - size
          - created_at
          default: created_at
      - name: sort_order
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: filter_by_name
        in: query
        description: Filter by attachment name
        required: false
        schema:
          type: string
      - name: filter_by_type
        in: query
        description: Filter by MIME type
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Attachments retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Attachment'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Attachment'
                    pagination:
                      $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Upload one or more attachments
      description: 'Upload one or more file attachments to a note. You can upload multiple files in a single request
        by repeating the `attachmentFile` field in the multipart form data. This is used, for example, to upload
        both a PNG image and an editable Excalidraw JSON file for a drawing. Each file will be saved as a separate
        attachment for the note.

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - note_id
              - attachmentFile
              properties:
                note_id:
                  type: string
                  description: ID of the note to attach the file(s) to
                attachmentFile:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 'One or more files to upload (max 10MB each). Repeat this field to upload multiple
                    files (e.g., both a PNG and a .excalidraw JSON file).

                    '
      responses:
        '201':
          description: Attachments uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete an attachment
      description: Delete an attachment and its associated file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - attachment_id
              - note_id
              properties:
                attachment_id:
                  type: integer
                  description: ID of the attachment to delete
                note_id:
                  type: string
                  description: ID of the note (for verification)
      responses:
        '200':
          description: Attachment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_attachment_id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /templates.php:
    get:
      summary: List templates
      description: Retrieve available templates for notes or pages
      parameters:
      - name: type
        in: query
        description: Template type
        required: false
        schema:
          type: string
          enum:
          - note
          - page
          default: note
      responses:
        '200':
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Manage templates
      description: 'Create, update, or delete templates. Use the `_method` field to override the HTTP method.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: Create template
                required:
                - type
                - name
                - content
                properties:
                  type:
                    type: string
                    enum:
                    - note
                    - page
                  name:
                    type: string
                    description: Template name
                  content:
                    type: string
                    description: Template content
              - type: object
                description: Update template
                required:
                - _method
                - type
                - current_name
                - content
                properties:
                  _method:
                    type: string
                    enum:
                    - PUT
                  type:
                    type: string
                    enum:
                    - note
                    - page
                  current_name:
                    type: string
                    description: Current template name
                  new_name:
                    type: string
                    description: New template name (optional)
                  content:
                    type: string
                    description: New template content
              - type: object
                description: Delete template
                required:
                - _method
                - type
                - name
                properties:
                  _method:
                    type: string
                    enum:
                    - DELETE
                  type:
                    type: string
                    enum:
                    - note
                    - page
                  name:
                    type: string
                    description: Template name to delete
      responses:
        '200':
          description: Template operation completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /extensions.php:
    get:
      summary: List active extensions
      description: Retrieve information about active extensions
      responses:
        '200':
          description: Extensions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  extensions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Extension'
        '500':
          $ref: '#/components/responses/ServerError'
  /webhooks.php:
    get:
      summary: List webhooks
      description: 'Retrieve all webhook configurations


        Query parameters select the action: `?id=N` addresses one webhook, `?action=history&id=N` returns its delivery
        log, `POST ?action=test&id=N` sends a test event and `POST ?action=verify&id=N` verifies the endpoint (only
        verified webhooks receive events). Update and delete are `PUT ?id=N` / `DELETE ?id=N`, or `POST ?id=N` with
        `"_method": "PUT"` / `"DELETE"` in the JSON body.'
      responses:
        '200':
          description: Webhooks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - &id001
        name: id
        in: query
        required: false
        schema: &id003
          type: integer
        description: Webhook id
      - &id002
        name: action
        in: query
        required: false
        schema:
          type: string
          enum:
          - history
          - test
          - verify
        description: Action on the webhook given by id
    post:
      summary: Create a webhook
      description: 'Create a new webhook configuration


        Query parameters select the action: `?id=N` addresses one webhook, `?action=history&id=N` returns its delivery
        log, `POST ?action=test&id=N` sends a test event and `POST ?action=verify&id=N` verifies the endpoint (only
        verified webhooks receive events). Update and delete are `PUT ?id=N` / `DELETE ?id=N`, or `POST ?id=N` with
        `"_method": "PUT"` / `"DELETE"` in the JSON body.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - entity_type
              - property_names
              properties:
                url:
                  type: string
                  format: uri
                  description: Webhook endpoint URL
                entity_type:
                  type: string
                  enum:
                  - note
                  - page
                  description: Type of entity to monitor
                property_names:
                  oneOf:
                  - type: string
                    enum:
                    - '*'
                    description: Monitor all properties
                  - type: array
                    items:
                      type: string
                    description: Array of property names to monitor
                event_types:
                  type: array
                  items:
                    type: string
                    enum:
                    - property_change
                    - entity_create
                    - entity_update
                    - entity_delete
                  default:
                  - property_change
                  description: Types of events to trigger the webhook
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - *id001
      - *id002
    put:
      summary: Update webhook
      description: Update an existing webhook configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                entity_type:
                  type: string
                  enum:
                  - note
                  - page
                property_names:
                  oneOf:
                  - type: string
                    enum:
                    - '*'
                  - type: array
                    items:
                      type: string
                event_types:
                  type: array
                  items:
                    type: string
                    enum:
                    - property_change
                    - entity_create
                    - entity_update
                    - entity_delete
                active:
                  type: boolean
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: id
        in: query
        required: true
        schema: *id003
        description: Webhook id
    delete:
      summary: Delete webhook
      description: Delete a webhook configuration
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - name: id
        in: query
        required: true
        schema: *id003
        description: Webhook id
components:
  schemas:
    Page:
      type: object
      properties:
        id:
          type: integer
          description: Unique page identifier
        name:
          type: string
          description: Page name (unique)
        content:
          type: string
          nullable: true
          description: Page content (can include properties)
        alias:
          type: string
          nullable: true
          description: Page alias
        active:
          type: integer
          description: Whether the page is active (1) or deleted (0)
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        properties:
          type: object
          description: Properties extracted from content
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Property'
        notes:
          type: array
          description: Notes belonging to this page (when includeNotes=true)
          items:
            $ref: '#/components/schemas/Note'
      required:
      - id
      - name
      - active
      - created_at
      - updated_at
    PageList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Note:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: Opaque note id (UUIDv7 for new notes)
        page_id:
          type: integer
          description: ID of the page this note belongs to
        parent_note_id:
          type: string
          nullable: true
          description: Id of the parent note, null for a top-level note
        content:
          type: string
          nullable: true
          description: Note content (can include properties)
        internal:
          type: integer
          description: Whether the note is marked as internal (1) or not (0)
        sort_key:
          type: string
          description: Fractional order key. Siblings are ordered by (sort_key, id) using byte comparison.
        version:
          type: integer
          description: Incremented on every change to the note
        collapsed:
          type: integer
          description: Whether the note is collapsed (1) or expanded (0)
        active:
          type: integer
          description: Whether the note is active (1) or deleted (0)
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        has_attachments:
          type: boolean
          description: Whether the note has file attachments
        properties:
          type: object
          description: Properties extracted from content
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Property'
        parent_properties:
          type: object
          description: Properties inherited from parent notes
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Property'
      required:
      - id
      - page_id
      - internal
      - sort_key
      - collapsed
      - active
      - created_at
      - updated_at
      - has_attachments
    NoteInput:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: Note content (can include properties)
        children:
          type: array
          description: Child notes, nested to any depth
          items:
            $ref: '#/components/schemas/NoteInput'
    Property:
      type: object
      properties:
        value:
          type: string
          description: Property value
        internal:
          type: boolean
          description: Whether this is an internal property (weight > 2)
      required:
      - value
    SearchResult:
      type: object
      properties:
        note_id:
          type: string
          description: Note ID (for note search results)
        page_id:
          type: integer
          description: Page ID (for page search results)
        content:
          type: string
          description: Note content
        page_name:
          type: string
          description: Name of the page containing the note
        content_snippet:
          type: string
          description: Highlighted snippet showing search match
        status:
          type: string
          description: Task status (for task search results)
        properties:
          type: object
          description: Note properties
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Property'
        parent_properties:
          type: object
          description: Properties from parent notes
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Property'
    Attachment:
      type: object
      properties:
        id:
          type: integer
          description: Unique attachment identifier
        note_id:
          type: string
          description: ID of the note this attachment belongs to
        name:
          type: string
          description: Original filename
        path:
          type: string
          description: Relative path to the file
        type:
          type: string
          description: MIME type
        size:
          type: integer
          description: File size in bytes
        url:
          type: string
          format: uri
          description: Full URL to access the file
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
      required:
      - id
      - note_id
      - name
      - path
      - type
      - created_at
    Template:
      type: object
      properties:
        name:
          type: string
          description: Template name
        content:
          type: string
          description: Template content with placeholders
      required:
      - name
      - content
    Extension:
      type: object
      properties:
        name:
          type: string
          description: Extension name
        featherIcon:
          type: string
          description: Feather icon name for the extension
      required:
      - name
      - featherIcon
    Webhook:
      type: object
      properties:
        id:
          type: integer
          description: Unique webhook identifier
        url:
          type: string
          format: uri
          description: Webhook endpoint URL
        secret:
          type: string
          description: Secret for webhook signature verification
        entity_type:
          type: string
          enum:
          - note
          - page
          description: Type of entity to monitor
        property_names:
          oneOf:
          - type: string
            enum:
            - '*'
          - type: array
            items:
              type: string
          description: Property names to monitor
        event_types:
          type: array
          items:
            type: string
            enum:
            - property_change
            - entity_create
            - entity_update
            - entity_delete
          description: Types of events to trigger the webhook
        active:
          type: integer
          description: Whether the webhook is active (1) or disabled (0)
        verified:
          type: integer
          description: Whether the webhook endpoint has been verified (1) or not (0)
        last_verified:
          type: string
          format: date-time
          nullable: true
          description: Last verification timestamp
        last_triggered:
          type: string
          format: date-time
          nullable: true
          description: Last trigger timestamp
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      required:
      - id
      - url
      - entity_type
      - property_names
      - event_types
      - active
      - verified
      - created_at
      - updated_at
    WebhookEvent:
      type: object
      properties:
        id:
          type: integer
          description: Unique event identifier
        webhook_id:
          type: integer
          description: ID of the webhook that triggered this event
        event_type:
          type: string
          description: Type of event
        payload:
          type: string
          description: JSON payload that was sent
        response_code:
          type: integer
          description: HTTP response code from the webhook endpoint
        response_body:
          type: string
          description: Response body from the webhook endpoint
        success:
          type: integer
          description: Whether the webhook call was successful (1) or failed (0)
        created_at:
          type: string
          format: date-time
          description: Event timestamp
      required:
      - id
      - webhook_id
      - event_type
      - success
      - created_at
    Pagination:
      type: object
      properties:
        total_items:
          type: integer
          description: Total number of items
        current_page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Number of items per page
        total_pages:
          type: integer
          description: Total number of pages
      required:
      - total_items
      - current_page
      - per_page
      - total_pages
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
          description: Response status
        message:
          type: string
          description: Error message
        details:
          oneOf:
          - type: string
          - type: object
          - type: array
          description: Additional error details
      required:
      - status
      - message
    Operation:
      type: object
      required:
      - op_id
      - type
      - id
      description: One intent operation. Fields beyond op_id, type and id depend on the type.
      properties:
        op_id:
          type: string
          maxLength: 64
          description: Unique id of this operation. An op_id that was already applied is ignored, so retries are
            safe.
        type:
          type: string
          enum:
          - create
          - edit
          - move
          - collapse
          - delete
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: Opaque note id chosen by the client (UUIDv7 recommended)
        page_id:
          type: integer
          description: 'create: the page the note belongs to'
        parent_id:
          type: string
          nullable: true
          description: 'create, move: id of the parent note, null for the top level'
        after:
          type: string
          nullable: true
          description: 'create, move: id of the sibling to place the note after, null to place it first'
        sort_key:
          type: string
          description: 'create, move (optional): order key computed by the client; replaced by the server if it
            does not fit between the neighbours'
        content:
          type: string
          description: 'create (optional), edit (required): the note text'
        collapsed:
          type: boolean
          description: create (optional), collapse (required)
    OperationsResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              op_id:
                type: string
              status:
                type: string
                enum:
                - applied
                - skipped
                - duplicate
        notes:
          type: array
          description: Authoritative state of every note the request touched
          items:
            $ref: '#/components/schemas/Note'
        deleted:
          type: array
          description: Ids removed by the request, including descendants
          items:
            type: string
        warnings:
          type: array
          description: Operations that could not be applied as sent
          items:
            type: object
            properties:
              index:
                type: integer
              op_id:
                type: string
              id:
                type: string
              code:
                type: string
                enum:
                - missing
                - exists
                - page_missing
                - parent_missing
                - after_missing
                - cycle
              message:
                type: string
  responses:
    BadRequest:
      description: Bad request - invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    none: {}
security:
- none: []
tags:
- name: Health
  description: Health check endpoints
- name: Pages
  description: Page management operations
- name: Notes
  description: Note management operations
- name: Properties
  description: Property management operations
- name: Search
  description: Search and query operations
- name: Attachments
  description: File attachment operations
- name: Templates
  description: Template management operations
- name: Extensions
  description: Extension information
- name: Webhooks
  description: Webhook management operations

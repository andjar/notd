<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>notd</title>
<link rel="stylesheet" href="client/style/tokens.css">
<link rel="stylesheet" href="client/style/app.css">
<link rel="stylesheet" href="client/style/outline.css">
<script type="module" src="client/app.js"></script>
</head>
<body>
<div class="app" id="app" hidden>
  <header class="topbar">
    <button class="icon" data-toggle="left" aria-label="Show the sidebar" title="Sidebar">☰</button>
    <div class="topbar-slot" data-slot="app.top"></div>
    <button class="icon" data-toggle="right" aria-label="Show the right sidebar" title="Right sidebar">◧</button>
  </header>
  <aside class="left" data-slot="app.left" aria-label="Sidebar"></aside>
  <main class="main">
    <div data-slot="page.header"></div>
    <div data-slot="page.before"></div>
    <article class="page" id="page"></article>
    <div data-slot="page.after"></div>
  </main>
  <aside class="right" data-slot="app.right" aria-label="Right sidebar"></aside>
  <footer class="status" data-slot="app.status"></footer>
</div>
<div class="gate" id="gate" hidden></div>
<noscript>notd needs JavaScript.</noscript>
</body>
</html>

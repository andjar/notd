name: PHP Tests

permissions:
  issues: write
  pull-requests: write

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2']
        test-suite: ['unit', 'integration', 'performance']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: sqlite3, pdo_sqlite, mbstring, json
        coverage: xdebug

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer dump-autoload

    - name: Debug composer autoloader
      run: |
        echo "Checking if composer autoloader was generated..."
        ls -la vendor/
        if [ -f "vendor/autoload.php" ]; then
          echo "✅ Composer autoloader found"
        else
          echo "❌ Composer autoloader NOT found"
          echo "Generating autoloader manually..."
          composer dump-autoload --optimize
        fi

    - name: Debug file structure
      run: |
        echo "Checking API files structure..."
        ls -la api/
        echo "Checking if classes have proper namespaces..."
        head -5 api/DataManager.php
        head -5 api/PatternProcessor.php
        head -5 api/PropertyTriggerService.php

    - name: Create test directories
      run: |
        mkdir -p db
        mkdir -p uploads/test
        mkdir -p coverage

    - name: Run quick functionality test
      run: |
        cd tests
        php quick_test.php
      env:
        DB_PATH: ${{ github.workspace }}/db/test_database.sqlite
        UPLOADS_DIR: ${{ github.workspace }}/uploads/test
        APP_ENV: testing

    - name: Start PHP built-in server
      if: matrix.test-suite == 'integration'
      run: php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
      env:
        DB_PATH: ${{ github.workspace }}/db/test_database.sqlite
        UPLOADS_DIR: ${{ github.workspace }}/uploads/test
        APP_ENV: testing

    - name: Wait for API server
      if: matrix.test-suite == 'integration'
      run: |
        for i in {1..20}; do
          if curl -sf "http://127.0.0.1:8000/api/v1/ping.php" > /dev/null; then
            echo "API server is ready"
            exit 0
          fi
          sleep 1
        done
        echo "API server did not become ready in time"
        cat /tmp/php-server.log || true
        exit 1

    - name: Run ${{ matrix.test-suite }} tests
      run: |
        cd tests
        php run_tests.php ${{ matrix.test-suite }}
      env:
        DB_PATH: ${{ github.workspace }}/db/test_database.sqlite
        UPLOADS_DIR: ${{ github.workspace }}/uploads/test
        API_BASE_URL: http://127.0.0.1:8000/api/v1
        APP_ENV: testing

    - name: Debug test failures
      if: failure()
      run: |
        echo "Tests failed. Running debug scripts..."
        echo "=== Syntax Validation ==="
        cd tests
        php validate_syntax.php
        echo ""
        echo "=== Bootstrap Debug ==="
        php debug_test.php
        echo ""
        echo "=== API Server Log (if any) ==="
        cat /tmp/php-server.log || true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.test-suite == 'unit' && matrix.php-version == '8.1'
      with:
        file: ./tests/coverage.txt
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.php-version }}-${{ matrix.test-suite }}
        path: |
          tests/test-results.xml
          tests/coverage/
          tests/testdox.html
          tests/testdox.txt

  test-summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        path: test-results

    - name: Generate test summary
      run: |
        SUMMARY_FILE="test-results/pr-summary.md"
        : > "$SUMMARY_FILE"

        write_summary_line () {
          echo "$1" | tee -a "$GITHUB_STEP_SUMMARY" "$SUMMARY_FILE" > /dev/null
        }

        write_summary_line "## Test Results Summary"
        write_summary_line ""
        write_summary_line "| PHP Version | Test Suite | Status |"
        write_summary_line "|-------------|------------|--------|"
        
        for result in test-results/*; do
          if [ -d "$result" ]; then
            suite=$(basename "$result" | sed 's/test-results-.*-//')
            version=$(basename "$result" | sed 's/test-results-\(.*\)-.*/\1/')
            
            if [ -f "$result/test-results.xml" ]; then
              status="✅ Passed"
            else
              status="❌ Failed"
            fi
            
            write_summary_line "| $version | $suite | $status |"
          fi
        done

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summaryPath = 'test-results/pr-summary.md';
          let summary = '';

          if (fs.existsSync(summaryPath)) {
            summary = fs.readFileSync(summaryPath, 'utf8').trim();
          }

          if (!summary) {
            summary = 'Test summary was empty. Please check workflow logs for details.';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          })

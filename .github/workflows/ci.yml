name: CI

on:
  push:
    branches: [next, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do php -l "$f" > /dev/null || status=1; done \
            < <(find . -name '*.php' -not -path './docs/*' -not -path './.git/*' -print0)
          exit $status
      - name: JavaScript syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do node --check "$f" || status=1; done \
            < <(find . \( -name '*.js' -o -name '*.mjs' \) -not -path './docs/*' -not -path './.git/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0)
          exit $status

name: CI

# The checks every pull request must pass. A suite that does not exist yet
# passes with a note, so each job can be required from the first day.

on:
  push:
    branches: [next, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do php -l "$f" > /dev/null || status=1; done \
            < <(find . -name '*.php' -not -path './docs/*' -not -path './.git/*' -print0)
          exit $status
      - name: JavaScript syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do node --check "$f" || status=1; done \
            < <(find . \( -name '*.js' -o -name '*.mjs' \) -not -path './docs/*' -not -path './.git/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0)
          exit $status

  php-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, intl
          coverage: none
      - name: Unit tests
        run: |
          if [ ! -f tests/php/run.php ]; then echo "No PHP test runner yet."; exit 0; fi
          php tests/php/run.php

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Client unit tests
        run: |
          if ! ls tests/js/*.test.mjs > /dev/null 2>&1; then echo "No client unit tests yet."; exit 0; fi
          node --test --test-reporter=spec tests/js/*.test.mjs
      - name: Protocol tests
        run: |
          if ! ls tests/conformance/*.test.mjs > /dev/null 2>&1; then echo "No conformance tests yet."; exit 0; fi
          node --test --test-reporter=spec tests/conformance/*.test.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for browser tests
        id: find
        run: |
          if ls tests/browser/*_test.py > /dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "No browser tests yet."; fi
      - uses: shivammathur/setup-php@v2
        if: steps.find.outputs.found == 'true'
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, intl
          coverage: none
      - name: Browser tests
        if: steps.find.outputs.found == 'true'
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          for t in tests/browser/*_test.py; do python3 "$t"; done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.169.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        working-directory: ./docs
        run: hugo --minify
      - name: Check links
        run: node tools/check_links.mjs docs/public /notd/

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests for the tools
        run: node --test tools/*.test.mjs
      - name: Core size budget
        run: node tools/budget.mjs

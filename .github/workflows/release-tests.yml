name: Release Tests

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance tests'
        required: false
        default: true
        type: boolean

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        php-version: ['8.1', '8.2']
        test-suite: ['unit', 'integration']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: sqlite3, pdo_sqlite, mbstring, json, xdebug
        coverage: xdebug

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer require --dev phpunit/phpunit

    - name: Create test directories
      run: |
        mkdir -p db
        mkdir -p uploads/test
        mkdir -p coverage

    - name: Run ${{ matrix.test-suite }} tests
      run: |
        cd tests
        php run_tests.php ${{ matrix.test-suite }} coverage
      env:
        DB_PATH: ./db/test_database.sqlite
        UPLOADS_DIR: ./uploads/test
        APP_ENV: testing

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.php-version }}-${{ matrix.test-suite }}
        path: tests/coverage/

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.php-version }}-${{ matrix.test-suite }}
        path: |
          tests/test-results.xml
          tests/testdox.html
          tests/testdox.txt

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.run_performance_tests != 'false'

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: sqlite3, pdo_sqlite, mbstring, json

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer require --dev phpunit/phpunit

    - name: Create test directories
      run: |
        mkdir -p db
        mkdir -p uploads/test

    - name: Run performance tests
      run: |
        cd tests
        php run_tests.php performance
      env:
        DB_PATH: ./db/test_database.sqlite
        UPLOADS_DIR: ./uploads/test
        APP_ENV: testing

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: |
          tests/test-results.xml
          tests/testdox.txt

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: sqlite3, pdo_sqlite, mbstring, json

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress

    - name: Run security check
      run: |
        composer audit --format=json > security-audit.json || true

    - name: Upload security results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit
        path: security-audit.json

  test-summary:
    needs: [full-test-suite, performance-tests, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        path: test-results

    - name: Generate comprehensive test summary
      run: |
        SUMMARY_FILE="test-results/release-summary.md"
        : > "$SUMMARY_FILE"

        write_summary_line () {
          echo "$1" | tee -a "$GITHUB_STEP_SUMMARY" "$SUMMARY_FILE" > /dev/null
        }

        write_summary_line "## 🧪 Release Test Results"
        write_summary_line ""
        write_summary_line "### Test Coverage Summary"
        write_summary_line ""
        
        # Count test results
        total_runs=0
        passed_runs=0
        
        for result in test-results/*; do
          if [ -d "$result" ]; then
            total_runs=$((total_runs + 1))
            if [ -f "$result/test-results.xml" ]; then
              passed_runs=$((passed_runs + 1))
            fi
          fi
        done
        
        write_summary_line "- **Total Test Runs:** $total_runs"
        write_summary_line "- **Passed:** $passed_runs"
        write_summary_line "- **Failed:** $((total_runs - passed_runs))"
        write_summary_line ""
        
        if [ $passed_runs -eq $total_runs ]; then
          write_summary_line "🎉 **All tests passed!**"
        else
          write_summary_line "❌ **Some tests failed. Please check the logs.**"
        fi
        
        write_summary_line ""
        write_summary_line "### Detailed Results"
        write_summary_line ""
        write_summary_line "| Test Suite | PHP Version | Status |"
        write_summary_line "|------------|-------------|--------|"
        
        for result in test-results/*; do
          if [ -d "$result" ]; then
            name=$(basename "$result")
            if [[ $name == test-results-* ]]; then
              suite=$(echo $name | sed 's/test-results-.*-//')
              version=$(echo $name | sed 's/test-results-\(.*\)-.*/\1/')
              
              if [ -f "$result/test-results.xml" ]; then
                status="✅ Passed"
              else
                status="❌ Failed"
              fi
              
              write_summary_line "| $suite | $version | $status |"
            fi
          fi
        done

    - name: Create Release Summary
      if: github.event_name == 'release'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summaryPath = 'test-results/release-summary.md';
          let summary = '';

          if (fs.existsSync(summaryPath)) {
            summary = fs.readFileSync(summaryPath, 'utf8').trim();
          }

          if (!summary) {
            summary = 'Release test summary was empty. Please check workflow logs for details.';
          }
          
          // Add test summary to release notes
          const release = context.payload.release;
          const newBody = release.body + '\n\n' + summary;
          
          github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.id,
            body: newBody
          }); 